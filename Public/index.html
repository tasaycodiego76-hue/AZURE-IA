<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure AI - Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/Css/Chat.css" rel="stylesheet"> 
</head>
<body class="bg-light">

    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">

        <h1 class="mb-2">Azure AI - PROYECTO FINAL </h1>
        <br>

        <div class="d-grid gap-3" style="width: 300px;">

            <a href="/extraccion.html" class="btn btn-primary btn-lg">
                Extraccion
            </a>

            <a href="/sentimientos.html" class="btn btn-primary btn-lg">
                Sentimientos
            </a>
            <a href="/analisis.html" class="btn btn-primary btn-lg">
                Analisis de Objetos
            </a>
            <a href="/resumen.html" class="btn btn-primary btn-lg">
                Resumen
            </a>
            <a href="/ocr.html" class="btn btn-primary btn-lg">
                Ocr
            </a>
            <a href="/imagen.html" class="btn btn-primary btn-lg">
                Analizar Imagen
            </a>
            <a href="/anonimizar.html" class="btn btn-primary btn-lg">
                Anonimizar
            </a>

        </div>

        <!-- Widget del chat -->
       <button id="chat-btn" title="Abrir chat">💬</button>
       <div id="chat-widget">
           <div id="chat-header">
               <div>Asistente Azure IA</div>
               <button id="chat-cerrar" title="Cerrar">✕</button>
           </div>
           <div id="chat-mensajes">
               <div class="chat-burbuja bot">¡Hola! ¿En qué puedo ayudarte hoy?</div>
           </div>
           <div id="chat-tokens"></div>
           <div id="chat-footer">
               <input id="chat-input" type="text" placeholder="Escribe tu mensaje..." autocomplete="off"/>
               <button id="chat-enviar">➤</button>
           </div>
       </div>
    </div>
<script src="/Js/Chat.js"></script>
</body>
</html>
