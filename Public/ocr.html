<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR - Leer texto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/Css/Chat.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 650px;">

        <a href="/" class="text-decoration-none text-muted">← Volver</a>

        <h2 class="mt-3 mb-1">OCR — Leer texto en imagen</h2>
        <p class="text-muted mb-4">Ingresa la URL de una imagen y extrae el texto que contiene.</p>

        <div class="mb-3">
            <label class="form-label">URL de la imagen</label>
            <input
                type="text"
                id="imageUrl"
                class="form-control"
                placeholder="https://ejemplo.com/imagen.jpg"
                oninput="previsualizarImagen(this.value)"
            >
        </div>

        <!-- Vista previa -->
        <div id="preview" class="mb-3 d-none">
            <img id="imgPreview" src="" alt="Vista previa"
                class="img-fluid rounded border"
                style="max-height: 250px; width: 100%; object-fit: contain;"
                onerror="document.getElementById('preview').classList.add('d-none')"
            >
        </div>

        <button id="btnAnalizar" class="btn btn-primary w-100" onclick="analizarOCR()">
            Analizar imagen
        </button>

        <!-- Resultado -->
        <div id="resultado" class="mt-4 d-none">
            <hr>
            <p class="text-muted mb-2">Total de líneas detectadas: <strong id="totalLineas"></strong></p>
            <ul id="listaTexto" class="list-group"></ul>
        </div>

        <!-- Error -->
        <div id="error" class="alert alert-danger mt-4 d-none"></div>

        <!-- Loading -->
        <div id="loading" class="text-center mt-4 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Procesando imagen, esto puede tardar unos segundos...</p>
        </div>

    </div>

   <script src="/Js/ocr.js"></script>
   <!-- Widget Chat -->
    <button id="chat-btn" title="Abrir chat">💬</button>
    <div id="chat-widget">
        <div id="chat-header">
            <div>Asistente Azure IA</div>
            <button id="chat-cerrar" title="Cerrar">✕</button>
        </div>
        <div id="chat-mensajes">
            <div class="chat-burbuja bot">¡Hola! ¿En qué puedo ayudarte hoy?</div>
        </div>
        <div id="chat-tokens"></div>
        <div id="chat-footer">
            <input id="chat-input" type="text" placeholder="Escribe tu mensaje..." autocomplete="off"/>
            <button id="chat-enviar">➤</button>
        </div>
    </div>
    <script src="/Js/Chat.js"></script>

</body>
</html>
