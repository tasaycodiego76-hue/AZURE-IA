<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracción de Datos - AZURE-IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Extracción de Datos</h1>

        <!-- Fila superior: Textarea + Categorías -->
        <div class="row mb-3">

            <!-- Columna izquierda: Dato de Entrada -->
            <div class="col-md-7">
                <div class="card h-100">
                    <div class="card-header">Dato de Entrada</div>
                    <div class="card-body d-flex flex-column">
                        <textarea id="textoInput" class="form-control flex-grow-1" rows="8"
                            placeholder="Ingresa el texto a analizar..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Columna derecha: Categorías + Botón -->
            <div class="col-md-5">
                <div class="card h-100">
                    <div class="card-header">Selecciona Categorías</div>
                    <div class="card-body d-flex flex-column">
                        <div class="flex-grow-1">
                            <div class="form-check">
                                <input class="form-check-input categoria-check" type="checkbox" id="DateTime"
                                    value="DateTime" checked>
                                <label class="form-check-label" for="DateTime">DateTime</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input categoria-check" type="checkbox" id="Organization"
                                    value="Organization" checked>
                                <label class="form-check-label" for="Organization">Organization</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input categoria-check" type="checkbox" id="Person"
                                    value="Person" checked>
                                <label class="form-check-label" for="Person">Person</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input categoria-check" type="checkbox" id="Location"
                                    value="Location" checked>
                                <label class="form-check-label" for="Location">Location</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input categoria-check" type="checkbox" id="Quantity"
                                    value="Quantity" checked>
                                <label class="form-check-label" for="Quantity">Quantity</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input categoria-check" type="checkbox" id="Product"
                                    value="Product" checked>
                                <label class="form-check-label" for="Product">Product</label>
                            </div>
                        </div>

                        <!-- Botón al fondo de la columna -->
                        <button id="btnAnalizar" class="btn btn-primary w-100 mt-3">Analizar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center mb-3" style="display: none;">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Analizando...</span>
            </div>
            <p class="text-muted mt-2">Analizando...</p>
        </div>

        <!-- Fila inferior: Resultados -->
        <div class="card" id="cardResultados" style="display: none;">
            <div class="card-header">Resultados</div>
            <div class="card-body">
                <div id="alertaResultados"></div>
                <div class="table-responsive">
                    <table class="table table-hover" id="tablaResultados">
                        <thead>
                            <tr>
                                <th>Texto</th>
                                <th>Categoría</th>
                                <th>Confianza</th>
                            </tr>
                        </thead>
                        <tbody id="resultadosBody"></tbody>
                    </table>
                </div>
                <div id="sinResultados" class="alert alert-info" style="display: none;">
                    No se encontraron entidades para las categorías seleccionadas
                </div>
            </div>
        </div>

    </div>

    <script src="/Js/Extraccion.js"></script>
</body>

</html>
